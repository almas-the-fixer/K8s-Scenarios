apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-demo-3
      tier: backend
  template:
    metadata: 
      labels:
        app: secret-demo-3
        tier: backend
    spec:
      containers:
        - name: demo-container
          image: busybox:1.25
          command: ["sh", "-c", "echo API_KEY=$API_KEY && sleep 3600"]
          envFrom:
            - secretRef:
                name: db-override
            - secretRef:
                name: db-primary
          volumeMounts:
            - name: secret-vol
              mountPath: /etc/secret
      volumes:
        - name: secret-vol
          secret:
            secretName: db-primary