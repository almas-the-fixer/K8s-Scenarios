apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web 
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop-web
  template:
    metadata:
      labels:
        app: shop-web
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.24
          ports:
            - containerPort: 80