apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-cart
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop-cart
      tier: backend
  template:
    metadata:
      labels:
        app: shop-cart
        tier: backend
    spec:
      containers:
        - name: cart
          image: nginx:1.25
          ports:
            - containerPort: 80
          env:
            - name: CART_MODE
              valueFrom:
                secretKeyRef:
                  name: cart-secret
                  key: cart_mode
          resources:
            requests:
              memory: 2Mi
            limits:
              memory: 2Mi