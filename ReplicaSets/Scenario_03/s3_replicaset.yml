apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: shop-rs
spec:
  replicas: 4
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: nginx:1.25
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: app_mode
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5