apiVersion: v1
kind: Pod
metadata:
  name: vol-s3-pod
spec:
  initContainers:
  - name: init-busybox
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Welcome to Scenario 3" > /data/index.html']
    volumeMounts:
    - name: shared-data
      mountPath: /wrong-data
  containers:
  - name: app-nginx
    image: nginx:alpine
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html
    - name: host-logs
      mountPath: /var/log/nginx
    - name: config-vol
      mountPath: /etc/nginx/conf.d
  volumes:
  - name: shared-data
    emptyDir: {}
  - name: host-logs
    hostPath:
      path: /var/log/nginx
      type: File
  - name: config-vol
    configMap:
      name: my-config