apiVersion: v1
kind: Pod
metadata:
  name: vol-s2-pod
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    volumeMounts:
    - name: host-logs
      mountPath: /app/logs
  volumes:
  - name: host-logs
    hostPath:
      path: /opt/strict-logs
      type: Directory