apiVersion: v1
kind: Pod
metadata:
  name: config-demo-3
spec:
  containers:
    - name: config-demo-3-container
      image: busybox:1.36
      command: ["sh", "-c", "echo DB_HOST=$DB_HOST && echo DB_PORT=$DB_PORT && cat /etc/nginx/nginx.conf && sleep 3600"]
      envFrom:
        - configMapRef:
            name: db-override
        - configMapRef:
            name: db-primary
      volumeMounts:
        - name: nginx-conf-vol
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
  volumes:
    - name: nginx-conf-vol
      configMap:
        name: db-primary
        items:
          - key: nginx.cfg
            path: nginx.conf