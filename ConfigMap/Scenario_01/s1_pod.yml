apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: config-demo-container
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:                      # Method #1 Getting one key at a Time
        - name: APP_LOG_LEVEL   # Because it will collide with envFrom so need to give a new name to this var so that we can verify unambiguously
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
      envFrom:                  # Method #2 Getting the whole configMap keys at once      
        - configMapRef:      
            name: app-config
      volumeMounts:             # Method #3 Mounting a ConfigMap as a Volume
        - name: config-vol
          mountPath: /etc/config
  volumes:                      # Referencing our ConfigMap as a Volume here with its name
    - name: config-vol
      configMap:
        name: app-config