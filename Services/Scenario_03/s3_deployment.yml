# s3_deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multi-app
  template:
    metadata:
      labels:
        app: multi-app
    spec:
      containers:
        - name: app
          image: nginx:1.25
          ports:
            - name: web
              containerPort: 80
            - name: metrics
              containerPort: 9090