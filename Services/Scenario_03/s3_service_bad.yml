apiVersion: v1
kind: Service
metadata:
  name: multi-svc
spec:
  type: NodePort
  selector:
    app: multi-app
  ports:
    - name: web
      port: 80
      targetPort: web-app
      protocol: UDP
      nodePort: 8080
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP