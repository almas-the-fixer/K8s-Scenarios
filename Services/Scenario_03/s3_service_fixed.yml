apiVersion: v1
kind: Service
metadata:
  name: multi-svc
spec:
  type: NodePort
  selector:
    app: multi-app
  ports:
    - name: web
      port: 80
      targetPort: web # Bug #2: targetPort can reference ports by name but here 'web-app' didnt match 'web' in deployment. so fixed web-app => web
      protocol: TCP # Bug #3: UDP field here means this couldnt be reached by normal curl commands i genuinely dont know why though
      nodePort: 30000 # Bug #1: Nodeport Expects ports ranging from 30000 - 32767 not out of this range so 8080 was invalid here and threw err
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP