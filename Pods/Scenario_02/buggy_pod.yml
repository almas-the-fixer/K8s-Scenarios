# Buggy Pod Copy it in s2_pod.yml and FIX!!
apiVersion: v1
kind: Pod
metadata:
  name: config-reader
  labels:
    app: config-reader
spec:
  containers:
    - name: config-reader
      image: busybox:1.36
      command: ["sh", "-c", "cat /etc/config/app.conf && sleep 3600"]
      volumeMounts:
        - name: config-vol
          mountPath: /etc/config
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
  volumes:
    - name: config-vol
      configMap:
        name: app-settings