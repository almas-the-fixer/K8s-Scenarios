# s3_pod.yml
# ⚠️ BUGGY — DO NOT use this as a template. Contains 3 intentional bugs for Scenario 3.
apiVersion: v1
kind: Pod
metadata:
  name: multi-check
  labels:
    app: multi-check
spec:
  nodeSelector:
    disktype: ssd
  initContainers:
    - name: init-setup
      image: busybox:1.36
      command: ["sh", "-c", "echo ready > /output/status.txt"]
      volumeMounts:
        - name: temp-data
          mountPath: /output
  containers:
    - name: app-main
      image: busybox:1.36
      command: ["sh", "-c", "cat /shared/status.txt && sleep 3600"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      livenessProbe:
        exec:
          command: ["sh", "-c", "test -f /shared/health.txt"]
        initialDelaySeconds: 10
        periodSeconds: 5
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
  volumes:
    - name: temp-data
      emptyDir: {}
    - name: shared-data
      emptyDir: {}