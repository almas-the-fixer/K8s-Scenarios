## Fixed Bugs ##
apiVersion: v1
kind: Pod
metadata:
  name: multi-check
  labels:
    app: multi-check
spec:
  nodeSelector:
    disktype: ssd # Bug #1 Need to add label "disktype:ssd" to our node
  initContainers:
    - name: init-setup
      image: busybox:1.36
      command: ["sh", "-c", "echo ready > /shared/status.txt"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared 
  containers:
    - name: app-main
      image: busybox:1.36
      command: ["sh", "-c", "cat /shared/status.txt && sleep 3600"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared # Bug #2 Need to have same paths for shared dirs
      livenessProbe:
        exec:
          command: ["sh", "-c", "test -f /shared/status.txt"] # Bug #3 The File health.txt doesnt exist either create it or use status.txt for liveness probe we will change it to status.txt
        initialDelaySeconds: 10
        periodSeconds: 5
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
  volumes:
    - name: temp-data
      emptyDir: {}
    - name: shared-data
      emptyDir: {}